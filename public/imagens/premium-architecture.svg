<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
 <linearGradient id="satin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#372b18"/><stop offset=".46" stop-color="#9c7941"/><stop offset=".7" stop-color="#5b4526"/><stop offset="1" stop-color="#17130d"/></linearGradient>
 <linearGradient id="bronze" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#15120b"/><stop offset=".55" stop-color="#785c31"/><stop offset="1" stop-color="#b39359"/></linearGradient>
 <pattern id="studs" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#ad8b4e"/></pattern>
